name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder
        id: find
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle NOT FOUND. Repo files are:"
            find . -not -path './.git/*' -type f | head -n 50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || {
            echo "=========== REAL ERROR ==========="
            grep -n -B 2 -A 15 -E "What went wrong|error:|FAILURE" build.log | head -n 60
            echo "=========== FILES ==========="
            ls -la
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TabKeyboard-APK
          path: "**/build/outputs/apk/debug/*.apk"
