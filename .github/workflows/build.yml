name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          z=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$z" ]; then
            echo "No zip file found in the repo. Upload TabKeyboard.zip."
            ls -la
            exit 1
          fi
          echo "Using $z"
          mkdir -p project
          unzip -q -o "$z" -d project
          if [ ! -f project/settings.gradle ]; then
            echo "settings.gradle not found after unzip. Contents:"
            find project -maxdepth 3 | head -n 50
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        working-directory: project
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || {
            echo "=========== REAL ERROR ==========="
            grep -n -B 2 -A 15 -E "What went wrong|error:|FAILURE" build.log | head -n 60
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TabKeyboard-APK
          path: project/app/build/outputs/apk/debug/*.apk
